<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>جارٍ فتح الدعوة</title>
<style>html,body{height:100%;margin:0;background:#09090b}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-family:Tahoma,Arial,sans-serif;color:#d9b66d}.s{width:44px;height:44px;border:2px solid #d9b66d33;border-top-color:#d9b66d;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{margin:0;font-size:18px}</style></head>
<body><div class="s"></div><p>جارٍ فتح الدعوة...</p><script>
(function(){var p=location.pathname;var base="/wedding-invitations/";var slug=p.startsWith(base)?p.slice(base.length).split("/")[0]:"";if(slug){sessionStorage.setItem("wedding_invitation_slug",slug);}location.replace(base);})();
</script></body></html>
