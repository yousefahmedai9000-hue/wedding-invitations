<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090909">
<title>دعوة زفاف ملكية</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap');
:root{--gold:#e5c579;--gold2:#a98036;--black:#080808;--panel:#11100e;--ivory:#fff6e4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--black);color:var(--ivory);font-family:'Cairo',Tahoma,Arial,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 50% 0%,#3b2b13 0,transparent 42%),radial-gradient(ellipse at 0% 50%,#251b0c 0,transparent 35%),radial-gradient(ellipse at 100% 80%,#211707 0,transparent 35%)}
a{color:inherit}
.wrap{position:relative;z-index:1;width:min(100%,760px);margin:auto;padding:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;color:var(--gold)}
.brand{font-family:'Amiri',serif;letter-spacing:2px;font-size:17px}
.music{border:1px solid #8d6b2d;background:#15120c;color:var(--gold);border-radius:50%;width:44px;height:44px;font-size:19px;cursor:pointer}
.hero{position:relative;min-height:680px;border:1px solid #9c7938;border-radius:190px 190px 26px 26px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;text-align:center;background:#18130a}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0505050a 15%,#05050545 45%,#050505f5 100%),url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=85') center/cover;transform:scale(1.02);animation:heroZoom 18s ease-in-out infinite alternate}
.hero:after{content:"";position:absolute;inset:12px;border:1px solid #e5c57988;border-radius:180px 180px 20px 20px;pointer-events:none}
.heroContent{position:relative;z-index:1;padding:35px 20px 42px;width:100%;animation:rise 1.3s both}
.kicker{color:var(--gold);font-size:12px;letter-spacing:3px;margin-bottom:14px}
.bismillah{font-family:'Amiri',serif;font-size:25px;color:#f2d99e;margin:0 0 18px}
h1{font-family:'Amiri',serif;font-weight:700;font-size:clamp(46px,12vw,78px);line-height:1.15;margin:8px 0;color:var(--gold);text-shadow:0 3px 22px #000}
.and{font-family:'Amiri',serif;font-size:28px;color:#fff0c7;margin:2px}
.heroSub{font-size:14px;line-height:2;color:#fff4df;margin:18px auto 0;max-width:360px}
.goldline{height:1px;width:150px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:24px auto}
.section{margin:20px 0;padding:28px 18px;border:1px solid #8d6b2d8a;border-radius:22px;background:linear-gradient(135deg,#17130cdd,#080808ee);box-shadow:0 10px 40px #0007;opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease}
.section.show{opacity:1;transform:translateY(0)}
.sectionTitle{font-family:'Amiri',serif;text-align:center;font-size:29px;color:var(--gold);margin:0 0 18px}
.verse{text-align:center;font-family:'Amiri',serif;font-size:23px;line-height:1.9;color:#f7e7c1}
